<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据库指标 · 政企月报</title>
<style>*{box-sizing:border-box}body{background:#f3f7fc;color:#19324c;font:15px/1.6 "PingFang SC",sans-serif;margin:0}main{max-width:1320px;margin:auto;padding:32px 5vw}a{color:#1469c4}h1{margin:12px 0}section{background:white;border:1px solid #dae5ef;border-radius:12px;padding:18px;margin:16px 0}fieldset{padding:0;border:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}button,input,select{font:inherit;padding:7px;border:1px solid #cbd8e4;border-radius:6px}button{cursor:pointer;background:#1469c4;color:white}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #e2e9ef}th{background:#eef4fa}small{color:#557086}.scroll{overflow:auto}</style>
<main><a href="/">← 返回月报总览</a><h1>数据库指标</h1><section><fieldset id="controls"><label>报告月份 <input id="month" type="month"></label><label>指标模块 <select id="owner"></select></label><button id="lookup">查询</button><button id="update" disabled>更新本项指标</button></fieldset><p id="msg" role="status">正在载入…</p><small>查询优先使用已有结果。更新会按所选模块和月份，用数据库中的源数据重新计算并保存成功批次。</small></section><section><h2>指标明细</h2><label>指标编码 <select id="metric"></select></label><p id="info"></p><div class="scroll"><table><thead><tr><th>统计维度</th><th>分子 / 本期量</th><th>分母 / 对比量</th><th>指标值</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const el=id=>document.getElementById(id);let current=null;
function draw(){const rows=(current?.results||[]).filter(r=>r.metric_code===el('metric').value);el('rows').replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');const rate=/(_rate|_mom|_yoy)$/.test(r.metric_code);for(const v of [Object.values(r.dimension).join(' · '),r.numerator,r.denominator,r.metric_value==null?'—':rate?(100*r.metric_value).toFixed(2)+'%':r.metric_value])tr.insertCell().textContent=v??'—';return tr}))}
function reset(){current=null;el('update').disabled=true;el('info').textContent='';el('metric').replaceChildren();draw()}
async function request(refresh=false){if(!refresh)reset();el('controls').disabled=true;el('msg').textContent=refresh?'正在重新计算…':'正在查询，缺少结果时将自动计算…';try{const res=await fetch('/api/v1/'+(refresh?'refresh':'query'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month:el('month').value,owner:el('owner').value,previous:current?.metric_run_id})});const data=await res.json();if(!res.ok)throw Error(data.error);current=data;el('metric').replaceChildren(...[...new Set(data.results.map(x=>x.metric_code))].map(x=>new Option(x,x)));el('info').textContent=data.start+' 至 '+data.end+' ｜ 批次 '+data.metric_run_id+' ｜ '+data.finished_at;el('msg').textContent=data.source==='calculated'?'计算完成，已保存并显示新批次。':'已读取数据库成功批次。';draw()}catch(e){el('msg').textContent=e.message+(current?'；继续显示上次成功结果。':'')}finally{el('controls').disabled=false;el('update').disabled=!current}}
el('lookup').onclick=()=>request();el('update').onclick=()=>request(true);el('month').onchange=el('owner').onchange=()=>request();el('metric').onchange=draw;
(async()=>{try{const r=await fetch('/api/v1/catalog');const c=await r.json();if(!r.ok)throw Error(c.error);el('owner').replaceChildren(...Object.entries(c.modules).map(([k,v])=>new Option(v,k)));el('month').value=c.months[0]||new Date().toISOString().slice(0,7);await request()}catch(e){el('msg').textContent=e.message}})();
</script></html>
